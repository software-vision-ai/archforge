[package]
name = "archforge-notations"
description = "The notations a project holds, composed into one store, one command table and one set of tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# A fake notation over archforge-mof's toy metamodel (`fake`), for the tests of the shell and the
# project store, which name no real notation (ADR 0005); never shipped.
testing = ["archforge-mof/testing", "dep:serde_json"]

[dependencies]
archforge-core.workspace = true
archforge-diagram.workspace = true
archforge-engine.workspace = true
archforge-er.workspace = true
archforge-mof.workspace = true
archforge-uml.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
archforge-engine = { workspace = true, features = ["testing"] }
serde_json.workspace = true

# The fake notation's own tests: its rows survive a save and a reopening.
[[test]]
name = "fake"
required-features = ["testing"]

[lints]
workspace = true
