[package]
name = "archforge-ui-egui"
description = "The user interface: Home, drawn from the design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Offscreen rendering of the window to an image, for screenshots, with UML's screens and what the
# tool reaches in them (until the tool moves to the app).
snapshot = ["dep:egui_kittest", "dep:archforge-uml", "dep:archforge-uml-ui"]
# What the app's window tests reach in the shell (`archforge_ui_egui::testing`); never shipped.
testing = ["dep:egui_kittest"]

[dependencies]
archforge-core.workspace = true
archforge-diagram.workspace = true
archforge-engine.workspace = true
archforge-er.workspace = true
archforge-notations.workspace = true
# UML's model and screens, for the screenshot tool only.
archforge-uml = { workspace = true, optional = true }
archforge-uml-ui = { workspace = true, optional = true, features = ["snapshot"] }
archforge-mof.workspace = true
archforge-names.workspace = true
archforge-shell-api.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, optional = true, features = ["wgpu"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# Overwrites an API key typed in Settings once it is handed to the host.
zeroize.workspace = true
skrifa.workspace = true
pulldown-cmark.workspace = true
egui_commonmark.workspace = true
# Reads the app icon built in for the bar's brand mark; it also writes the snapshot example's picture.
png.workspace = true
# The folded texts a search matches against, kept between frames (crate::home_search::Found,
# crate::project_search::Entry).
craft-i18n.workspace = true

[dev-dependencies]
archforge-mof = { workspace = true, features = ["testing"] }
# The shell's tests build the shell with UML's model and screens, as the app registers them, until
# they are given the fake notation.
archforge-uml.workspace = true
archforge-uml-ui = { workspace = true, features = ["snapshot"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
serde_json.workspace = true

[[example]]
name = "snapshot"
required-features = ["snapshot"]

[lints]
workspace = true
