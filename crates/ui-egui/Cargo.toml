[package]
name = "archforge-ui-egui"
description = "The user interface: Home, drawn from the design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Offscreen rendering of the window to an image, for screenshots.
snapshot = ["dep:egui_kittest"]

[dependencies]
archforge-core.workspace = true
archforge-diagram.workspace = true
archforge-engine.workspace = true
archforge-er.workspace = true
archforge-mof.workspace = true
archforge-names.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, optional = true, features = ["wgpu"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
skrifa.workspace = true
pulldown-cmark.workspace = true
egui_commonmark.workspace = true
# Reads the app icon built in for the bar's brand mark; it also writes the snapshot example's picture.
png.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
serde_json.workspace = true

[[example]]
name = "snapshot"
required-features = ["snapshot"]

[lints]
workspace = true
