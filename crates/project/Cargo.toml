[package]
name = "archforge-project"
description = "A project on disk: create it, open it and read its settings, through its Dolt server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# A way for the tests of other crates to shape a branch.
testing = []

[dependencies]
archforge-dolt.workspace = true
archforge-mof.workspace = true
archforge-names.workspace = true
archforge-secrets.workspace = true
log.workspace = true
mysql.workspace = true

[dev-dependencies]
# A model to write and read back: the fake notation's, which names no real notation (ADR 0005).
# ER's and UML's own saved models are tested in the app (`apps/archforge/tests/saved_model.rs`).
archforge-notations = { workspace = true, features = ["testing"] }
archforge-secrets = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
