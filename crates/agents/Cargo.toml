[package]
name = "archforge-agents"
description = "The agent runtimes a person installs: finds them, checks their versions, and runs and supervises them as child processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Lets the tests change a session's request timeout between steps; never shipped.
testing = []

[dependencies]
archforge-control.workspace = true
archforge-secrets.workspace = true
craft-atomic.workspace = true
log.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
archforge-agents = { path = ".", features = ["testing"] }

[lints]
workspace = true
