# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit's settings for Archforge. With inheritance on, settings not named here keep the
# organisation's values; without it, this file would replace them.
#
# A pull request merges only on CodeRabbit's approval. CodeRabbit approves when its review
# threads are resolved, the latest commit is reviewed and the pre-merge checks pass. A finding
# outside the changed lines opens no thread, so before this file such a finding did not hold the
# approval back (#211 was approved seven seconds after two "Major" outside-diff findings). The
# custom check below turns every unresolved finding into a failing pre-merge check, so no
# automatic approval comes while one is open. The merge-risk limit holds approve and resolve
# commands back the same way, since those commands honour risk limits but not pre-merge checks.
inheritance: true
reviews:
  profile: chill
  auto_approvals:
    enabled: true
    # The author's own @coderabbitai approve or resolve would get around the findings check.
    allow_author_approval: false
    # Approve and resolve commands do not wait for pre-merge checks, but they do honour this
    # limit. With the merge-risk instructions below, an open finding rates the pull request
    # Critical, so no approval, by command or automatic, comes while one is open.
    max_merge_risk: high
  merge_risk_instructions: |
    Rate merge risk Critical while any Critical, Major or Minor finding CodeRabbit has raised on
    this pull request is still unresolved for the latest commit, whether it was posted in a review
    thread, as an "outside diff range" comment, or as an actionable comment in a review summary.
    A finding is resolved only when the latest commit changes the code so it no longer applies, or
    when its review thread is resolved after a reply that shows why it does not apply. Nitpick and
    Trivial comments do not raise the rating. With no such finding open, rate the change on its own
    merits.
  auto_review:
    # Review every commit; a paused review left #210's last commit unreviewed for half an hour.
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    # The author cannot override or ignore a failing check; only a requested reviewer can.
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 80
    custom_checks:
      - name: "No open findings"
        mode: error
        instructions: |
          Fail if any finding CodeRabbit has raised on this pull request is still unresolved for
          the latest commit, whether it was posted in a review thread, as an "outside diff range"
          comment, or as an actionable comment in a review summary.

          A finding is resolved only when the latest commit changes the code so the finding no
          longer applies, or when its review thread is resolved after a reply that shows why it
          does not apply.

          Pass only when no Critical, Major or Minor finding raised on any commit of this pull
          request remains unresolved for the latest commit. Nitpick and Trivial comments do not
          fail the check, but list them. When failing, list each open finding with its severity,
          file, line range and title.
