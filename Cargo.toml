[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-vision-ai/archforge"

[workspace.dependencies]
# Internal crates: members say `name.workspace = true` and never repeat a version or a path.
archforge-ui-egui = { path = "crates/ui-egui" }
archforge-dolt = { path = "crates/dolt" }
archforge-names = { path = "crates/names" }
archforge-engine = { path = "crates/engine" }
archforge-er = { path = "crates/er" }
archforge-mof = { path = "crates/mof" }
archforge-uml = { path = "crates/uml" }
archforge-core = { path = "crates/core" }
archforge-diagram = { path = "crates/diagram" }
archforge-project = { path = "crates/project" }

# External crates.
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", features = ["wgpu"] }
egui_kittest = "0.37"
muda = "0.21"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Writes the snapshot example's picture; already in the lockfile through eframe's icon loading,
# MIT OR Apache-2.0, pure Rust under forbid(unsafe_code).
png = "=0.18.1"
# Checks an installed font's bytes before egui loads them: the parser egui 0.36 itself loads fonts
# with, so a face it would refuse never reaches it; pinned exactly and moved with epaint's
# own skrifa whenever egui moves. MIT OR Apache-2.0.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Parses the installed fonts' names for the desktop app, from bytes the app reads itself (no
# memmap, no file access, no fontconfig); untrusted input, pinned exactly. MIT.
fontdb = { version = "=0.24.0", default-features = false, features = ["std"] }

# Talks to the project database's Dolt server over the MySQL protocol, on the same machine only:
# pure Rust, no TLS. MIT OR Apache-2.0; pinned exactly, as it reads the server's replies.
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust"] }
# Random passwords and run folder names for the Dolt server. MIT OR Apache-2.0.
getrandom = "0.3"

# Shared crates from craft-libs (the ArtCraft team, MIT OR Apache-2.0), always at its latest main:
# the gate's first step moves Cargo.lock to the newest commit. It is the only git source
# `deny.toml` allows.
craft-atomic = { git = "https://github.com/storytold/craft-libs", branch = "main" }

[workspace.lints.rust]
unsafe_code = "forbid" # "deny" only when one isolated crate exists

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
