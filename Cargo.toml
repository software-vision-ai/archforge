[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.14.0"
edition = "2024"
# The version rust-toolchain.toml pins, the one the gate builds with; the two change together.
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-vision-ai/archforge"

[workspace.dependencies]
# Internal crates: members say `name.workspace = true` and never repeat a version or a path.
archforge-shell-api = { path = "crates/shell-api" }
archforge-ui-egui = { path = "crates/ui-egui" }
archforge-uml-ui = { path = "crates/uml-ui" }
archforge-dolt = { path = "crates/dolt" }
archforge-names = { path = "crates/names" }
archforge-engine = { path = "crates/engine" }
archforge-er = { path = "crates/er" }
archforge-mof = { path = "crates/mof" }
archforge-notations = { path = "crates/notations" }
archforge-uml = { path = "crates/uml" }
archforge-core = { path = "crates/core" }
archforge-diagram = { path = "crates/diagram" }
archforge-project = { path = "crates/project" }
archforge-control = { path = "crates/control" }
archforge-mcp = { path = "crates/mcp" }
archforge-secrets = { path = "crates/secrets" }
archforge-agents = { path = "crates/agents" }

# External crates.
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# eframe 0.37's defaults add system_fonts, a provider that scans and memory-maps the system's font
# files and loads fontconfig: the app reads installed fonts itself, never mapped (apps/archforge
# src/fonts.rs). So the defaults are off and 0.36's set is named, with clipboard, which egui-winit
# enabled then, and winit's defaults through winit.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
# eframe's winit, with its defaults (raw-window-handle 0.6, x11, wayland with client-side
# decorations), as eframe's own default features gave it.
winit = "0.30"
egui_kittest = "0.37"
# The macOS menu bar. Without its default gtk3 feature, so no GTK, glib or their Linux libraries
# enter the lockfile: Archforge draws no native menu on Linux.
muda = { version = "0.21", default-features = false }
# The native folder picker (owner decision): MIT; on Linux it asks the desktop portal over D-Bus,
# pure Rust, no GTK. craft-dialogs shows it and builds it without its default `wayland` feature;
# this direct dependency is here for that feature, so on Wayland the portal's picker keeps the
# window as its parent.
rfd = "0.17"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Writes the snapshot example's picture; already in the lockfile through eframe's icon loading,
# MIT OR Apache-2.0, pure Rust under forbid(unsafe_code).
png = "=0.18.1"
# Skills are written in Markdown: the parser that places every element for the styled source, and
# the viewer that draws the rendered page. MIT, and MIT OR Apache-2.0; both pure Rust, the viewer
# without its image, regex and network features (deny.toml bans those). Pinned exactly, as both
# read text from project files.
pulldown-cmark = { version = "=0.13.6", default-features = false }
egui_commonmark = { version = "=0.26.0", default-features = false, features = ["pulldown_cmark"] }
# Checks an installed font's bytes before egui loads them: the parser egui 0.37 itself loads fonts
# with, so a face it would refuse never reaches it; pinned exactly and moved with epaint's
# own skrifa whenever egui moves. MIT OR Apache-2.0.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Parses the installed fonts' names for the desktop app, from bytes the app reads itself (no
# memmap, no file access, no fontconfig); untrusted input, pinned exactly. MIT.
fontdb = { version = "=0.24.0", default-features = false, features = ["std"] }

# Talks to the project database's Dolt server over the MySQL protocol, on the same machine only:
# pure Rust, no TLS. MIT OR Apache-2.0; pinned exactly, as it reads the server's replies.
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust"] }
# Random passwords and run folder names for the Dolt server. MIT OR Apache-2.0.
getrandom = "0.3"
# API keys in the system credential store (owner decision; crates/secrets/README.md says why these
# features): its v1 set with the defaults named, so only the macOS keychain, the Windows Credential
# Manager and the pure-Rust Secret Service over zbus build; no libdbus, no OpenSSL. MIT OR
# Apache-2.0; pinned exactly, as it holds the keys. Its store crates (keyring-core and the three
# backends) are held by Cargo.lock and move only with a reviewed lockfile change.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
# Overwrites a secret's bytes when it is dropped. MIT OR Apache-2.0, pure Rust; also pulled in by
# keyring's Windows store.
zeroize = "1"
# The effective user id and the open flags for the control token file's checks (Unix), through a
# safe API;
# already in the lockfile, Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

# Shared crates from craft-libs (the ArtCraft team, MIT OR Apache-2.0), following its main branch:
# `cargo xtask bump` moves Cargo.lock to its newest commit, in a pull request of its own; the gate
# never does. It is the only git source `deny.toml` allows.
craft-atomic = { git = "https://github.com/storytold/craft-libs", branch = "main" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", branch = "main" }
# The folder pickers, queued in the frame and shown at its end, answered on a later frame: a
# blocking picker inside winit's handler aborts the app on macOS when an event re-enters it.
craft-dialogs = { git = "https://github.com/storytold/craft-libs", branch = "main" }
# Search folding (`Folder`): case, accents, `ß` and compatibility forms count for nothing in a
# name search a user types. Without `collate`, so no collation data. It pins ICU4X `~2.3`, which
# holds the lockfile's `icu_*` crates below 2.4 for as long as it does.
craft-i18n = { git = "https://github.com/storytold/craft-libs", branch = "main" }
# Tests only: `deadline::wait_until`, a bounded wait for a condition another thread makes true.
craft-testkit = { git = "https://github.com/storytold/craft-libs", branch = "main" }
# The combining marks and Hangul syllable parts that `Folded::find` never matches inside, so the
# project search ranks on the same boundaries; the version craft-i18n already locks. Unicode-3.0.
icu_properties = "2.3"

[workspace.lints.rust]
unsafe_code = "forbid" # "deny" only when one isolated crate exists

[workspace.lints.clippy]
# Never crash (AGENTS.md): none of the panicking shortcuts in production code. Every member takes
# these through `[lints] workspace = true`, which the gate's lint step checks; clippy.toml lets
# `#[test]` and `#[cfg(test)]` code unwrap, expect and panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
