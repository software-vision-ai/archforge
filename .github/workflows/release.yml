# Release: every package from one workflow, into a draft release published by hand.
#
#   macOS universal         .dmg                                packaging/macos/package.sh
#   Windows x64, ARM64      .msi and a portable .zip            packaging/windows/package.ps1
#   Linux x86_64, aarch64   AppImage (+ .zsync), .deb, .rpm,    packaging/linux/package.sh
#                           .tar.gz
#
# A push to the `release` branch builds every package and attaches them, with SHA256SUMS, to a
# DRAFT release named Archforge v<version>, the version from Cargo.toml's [workspace.package]
# (docs/releasing.md). Its notes are GitHub's, made from the pull requests merged since the last
# release, under Archforge's own lines. The owner reads the draft and publishes it, which creates
# the tag v<version>. A version with a suffix (0.2.0-rc.1) is a pre-release. A version published
# already is refused: bump it first. A pull request that touches packaging or this file, and a run
# started by hand, build every package as a dry run: the packages stay workflow artefacts and
# nothing is released. Every package reports its version, commit and date. The README's
# screenshots and the wiki's guide screens (`cargo xtask screens --gallery`) are rendered here and
# attached to every release. Nothing is signed yet; the scripts' signing steps wait for their secrets.
name: Release

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read the version, and refuse one published already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p&&/^version/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Cargo.toml's [workspace.package] holds no version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # Only a release is refused for a published version: a dry run builds and checks the packages whatever the version.
          draft=$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/release ]; then
            echo "::error::Archforge v$version is published already; bump the version (cargo xtask version) before releasing again"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          { echo "version=$version"; echo "prerelease=$prerelease"; echo "sha=${GITHUB_SHA::9}"; echo "date=$(date -u +%Y-%m-%d)"; } >>"$GITHUB_OUTPUT"
          echo "### Archforge $version (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every package reports its version, commit and date (apps/archforge/build.rs).
      ARCHFORGE_BUILD_SHA: ${{ needs.version.outputs.sha }}
      ARCHFORGE_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The interface's fonts, from craft-fonts beside the checkout
        run: git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts
      - name: Rust for both halves of the universal binary
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build and package (dmg)
        run: sh packaging/macos/package.sh "$VERSION"
      - name: Check the disk image
        run: |
          dmg="dist/macos/archforge-$VERSION-macos-universal.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg" >/dev/null
          app="$RUNNER_TEMP/dmg/Archforge.app"
          lipo -archs "$app/Contents/MacOS/archforge" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/archforge" | grep -q arm64
          test -f "$app/Contents/Resources/LICENSE-MIT"
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" | grep -qx "${VERSION%%-*}"
          hdiutil detach "$RUNNER_TEMP/dmg" >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/macos/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    # ARM64 is built natively on GitHub's Windows 11 ARM runner, and checked there.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every package reports its version, commit and date (apps/archforge/build.rs).
      ARCHFORGE_BUILD_SHA: ${{ needs.version.outputs.sha }}
      ARCHFORGE_BUILD_DATE: ${{ needs.version.outputs.date }}
      WIX_VERSION: 5.0.2
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The interface's fonts, from craft-fonts beside the checkout
        shell: bash
        run: git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts
      - name: Rust and WiX
        shell: pwsh
        run: |
          # The ARM image may come without rustup: then it is fetched for this machine, from rust-lang.org.
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$env:TARGET/rustup-init.exe" -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
            $bin = Join-Path $env:USERPROFILE '.cargo\bin'
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $env:TARGET
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
      - name: The icon in every size
        shell: bash
        run: sh packaging/icons.sh
      - name: Build and package (msi, zip)
        shell: pwsh
        run: packaging/windows/package.ps1 -Version $env:VERSION -Arch $env:ARCH -Target $env:TARGET
      - name: Check the packages
        shell: pwsh
        run: |
          $zip = "dist/windows/archforge-$env:VERSION-windows-$env:ARCH.zip"
          $names = (Get-ChildItem dist/windows -File).Name
          if (-not ($names -contains "archforge-$env:VERSION-windows-$env:ARCH.msi")) { throw "no msi among $names" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/portable"
          foreach ($f in 'archforge.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md') {
            if (-not (Test-Path "$env:RUNNER_TEMP/portable/$f")) { throw "$zip lacks $f" }
          }
          # The executable runs here, on its own architecture, and reports this build.
          $line = & "$env:RUNNER_TEMP/portable/archforge.exe" --version | Out-String
          Write-Output $line
          if (-not $line.Contains("archforge $env:VERSION ($env:ARCHFORGE_BUILD_SHA, $env:ARCHFORGE_BUILD_DATE)")) { throw "archforge.exe reports $line" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/windows/*.msi
            dist/windows/*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest hosted image, so the binaries need only glibc 2.35.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every package reports its version, commit and date (apps/archforge/build.rs).
      ARCHFORGE_BUILD_SHA: ${{ needs.version.outputs.sha }}
      ARCHFORGE_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The interface's fonts, from craft-fonts beside the checkout
        run: git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts
      - name: Rust and the window system's development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev zsync
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: sh packaging/linux/package.sh "$VERSION" "${{ matrix.arch }}"
      - name: Check the packages
        run: |
          base="dist/linux/archforge-$VERSION-linux-${{ matrix.arch }}"
          tar -tzf "$base.tar.gz" | grep -qx ./bin/archforge
          dpkg-deb --contents "$base.deb" | grep -q 'usr/bin/archforge$'
          test -s "$base.rpm"
          test -s "$base.AppImage.zsync"
          chmod +x "$base.AppImage"
          "$base.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/archforge
          # The binary reports this build, not a dev build.
          squashfs-root/usr/bin/archforge --version | tee /dev/stderr | grep -F "archforge $VERSION ($ARCHFORGE_BUILD_SHA, $ARCHFORGE_BUILD_DATE)"
          rm -rf squashfs-root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.AppImage.zsync
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.tar.gz
          if-no-files-found: error

  screenshots:
    name: Screenshots
    needs: version
    # The README's gallery and the wiki's guide screens, rendered from this commit and attached to
    # the release: the README and the wiki show the latest release's. Mesa's software Vulkan driver
    # stands in for a GPU.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The interface's fonts, from craft-fonts beside the checkout
        run: git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts
      - name: Rust, the window system's development packages and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev mesa-vulkan-drivers libvulkan1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Render the gallery
        run: cargo xtask screens --gallery dist/screenshots
      - name: Check the pictures
        run: |
          for f in dist/screenshots/*.png; do
            test "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a || { echo "::error::$f is not a PNG"; exit 1; }
            test "$(stat -c %s "$f")" -gt 20000 || { echo "::error::$f is too small to be a screen"; exit 1; }
          done
          ls -l dist/screenshots
      - name: Every picture the README shows
        # The README loads its gallery from the latest release, so a release without one of these
        # files shows a broken picture on the repository's front page: no draft is made without it.
        run: |
          shown=$(grep -o 'releases/latest/download/screenshot-[a-z-]*-[a-z]*\.png' README.md | sed 's|.*/||' | sort -u)
          test -n "$shown" || { echo "::error::README.md shows no screenshot from the latest release"; exit 1; }
          missing=0
          for f in $shown; do
            test -s "dist/screenshots/$f" || { echo "::error::README.md shows $f, which the gallery did not render"; missing=1; }
          done
          exit "$missing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, macos, windows, linux, screenshots]
    # Only a push to the release branch releases: everything else is a dry run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    # The one job that may write: it creates or updates the draft release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every package reports its version, commit and date (apps/archforge/build.rs).
      ARCHFORGE_BUILD_SHA: ${{ needs.version.outputs.sha }}
      ARCHFORGE_BUILD_DATE: ${{ needs.version.outputs.date }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS >>"$GITHUB_STEP_SUMMARY"
      - name: Notes, from the pull requests merged since the last release
        run: |
          cat >notes.md <<NOTES
          Archforge $VERSION, for macOS (universal), Windows (x64, ARM64) and Linux (x86_64, aarch64).

          **Before you start:** Archforge keeps projects in [Dolt](https://docs.dolthub.com/introduction/installation) 2.6 or a later 2.x. Install it first; Archforge finds it on the PATH, where Homebrew and Dolt's installer put it on macOS, or where \`ARCHFORGE_DOLT\` says.

          The packages are not signed yet: the [README](https://github.com/$GITHUB_REPOSITORY#get-started) says how to open them on macOS and Windows. Agent access is not available on Windows yet. \`SHA256SUMS\` holds every file's checksum.

          NOTES
          # GitHub's own notes: What's Changed, New Contributors and the Full Changelog link.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" -q .body >>notes.md
          cat notes.md >>"$GITHUB_STEP_SUMMARY"
      - name: Create or update the draft
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          if draft=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            # A published release keeps the files people downloaded; only a draft is refreshed.
            if [ "$draft" != true ]; then
              echo "::error::$tag is published already; its files are left as they are"
              exit 1
            fi
            gh release upload "$tag" assets/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file notes.md "${pre[@]}" -R "$GITHUB_REPOSITORY"
          else
            # The tag is made when the owner publishes the draft, on the commit built here.
            gh release create "$tag" assets/* --draft --target "$GITHUB_SHA" --title "Archforge v$VERSION" --notes-file notes.md "${pre[@]}" -R "$GITHUB_REPOSITORY"
          fi
