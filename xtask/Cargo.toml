[package]
name = "xtask"
description = "The repository task runner: the gate and its checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
# Reads XMI for the metamodel generator; untrusted input, so pinned exactly. MIT, pure Rust, already
# in the lockfile through the desktop stack. Never a dependency of the application.
quick-xml = "=0.41.0"
archforge-mof.workspace = true
# Scales the app icon to the packaging sizes (cargo xtask resize); already a workspace dependency.
png.workspace = true
# Writes the contact sheets of cargo xtask screens atomically; already a workspace dependency.
craft-atomic.workspace = true
# Parses the sources for the diagram-kind check (cargo xtask kinds): literals cooked as the
# language reads them, modules and test items as they are. Both already in the lockfile through the
# desktop stack's derive macros, at these versions; never a dependency of the application.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
# Line and column of each literal and item, for the findings and the comment marks; the ux check
# (ux_literals.rs) reads its sources as these tokens.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
# Reads each member's manifest for the lints check (cargo xtask ci), and clippy.toml's banned types
# for the ux check: a TOML parser, so a value never reads as a table. Already in the lockfile through egui_kittest, at this version; only its parser, no
# serde or writer. MIT OR Apache-2.0; never a dependency of the application.
toml = { version = "1.1.8", default-features = false, features = ["parse"] }

[dev-dependencies]
archforge-mof = { workspace = true, features = ["testing"] }

[lints]
workspace = true
