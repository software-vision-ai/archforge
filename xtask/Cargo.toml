[package]
name = "xtask"
description = "The repository task runner: the gate and its checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
# Reads XMI for the metamodel generator; untrusted input, so pinned exactly. MIT, pure Rust, already
# in the lockfile through the desktop stack. Never a dependency of the application.
quick-xml = "=0.41.0"
archforge-mof.workspace = true
# Scales the app icon to the packaging sizes (cargo xtask resize); already a workspace dependency.
png.workspace = true
# Writes the contact sheets of cargo xtask screens atomically; already a workspace dependency.
craft-atomic.workspace = true

[dev-dependencies]
archforge-mof = { workspace = true, features = ["testing"] }

[lints]
workspace = true
